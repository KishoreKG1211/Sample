name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npx cypress run || true # prevents job failure so email always runs

      - name: Send result to Teams channel via SendGrid
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.sendgrid.net
          server_port: 587
          secure: false
          username: "apikey"                        
          password: ${{ secrets.SENDGRID_API_KEY }} 
          subject: "Cypress Pipeline - ${{ job.status }}"   
          from: "GitHub Actions <kishorekumar.gunasekar@bounteous.com>"
          to: "kishorekumargunasekar@gmail.com"
          body: |
            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_number }}
            Status: ${{ job.status }}
            Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
