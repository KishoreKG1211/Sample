name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm ci
          npx cypress install

      - name: Run Cypress tests
        run: |
          npx cypress run
        continue-on-error: true   # don't stop workflow if tests fail

      - name: Send Webhook Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -H "Content-Type: application/json" \
               -d "{
                 \"@type\": \"MessageCard\",
                 \"@context\": \"https://schema.org/extensions\",
                 \"summary\": \"Cypress Pipeline\",
                 \"themeColor\": \"${STATUS == 'success' && '00FF00' || 'FF0000'}\",
                 \"title\": \"GitHub Actions - Cypress Pipeline\",
                 \"text\": \"${STATUS == 'success' && '✅ Build passed' || '❌ Build failed'}<br>
                            Repository: ${{ github.repository }}<br>
                            Run: <a href='${RUN_URL}'>View Logs</a>\"
               }" \
               "$WEBHOOK_URL"
