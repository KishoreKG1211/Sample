name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm ci
          npx cypress install
          npm install --save-dev mochawesome mochawesome-merge mochawesome-report-generator

      - name: Run Cypress tests with Mochawesome reporter
        run: |
          npx cypress run --reporter mochawesome --reporter-options reportDir=results,overwrite=false,html=false,json=true
          npx mochawesome-merge results/*.json > results.json

      - name: Send Webhook Notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TOTAL=$(jq '.stats.tests' results.json)
          PASSED=$(jq '.stats.passes' results.json)
          FAILED=$(jq '.stats.failures' results.json)

          if [ "$STATUS" = "success" ]; then
            COLOR="00FF00"
            MESSAGE="✅ Build passed"
          else
            COLOR="FF0000"
            MESSAGE="❌ Build failed"
          fi

          cat <<EOF > payload.json
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "summary": "Cypress Pipeline",
            "themeColor": "$COLOR",
            "title": "GitHub Actions - Cypress Pipeline",
            "text": "$MESSAGE<br>
                     Repository: ${{ github.repository }}<br>
                     Tests: $TOTAL<br>
                     Passed: $PASSED<br>
                     Failed: $FAILED<br>
                     Run: <a href='$RUN_URL'>View Logs</a>"
          }
          EOF

          curl -H "Content-Type: application/json" \
               -d @payload.json \
               "$WEBHOOK_URL"
