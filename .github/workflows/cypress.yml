name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm ci
          npx cypress install
          npm install --save-dev mochawesome mochawesome-merge mochawesome-report-generator

      - name: Run Cypress tests with Mochawesome reporter
        run: |
          npx cypress run --reporter mochawesome \
            --reporter-options "reportDir=cypress/results,overwrite=false,html=false,json=true"

      - name: Merge results into single JSON
        id: merge
        run: |
          npx mochawesome-merge cypress/results/*.json > cypress-output.json

          echo "Stats preview:"
          cat cypress-output.json | jq '.stats'

          TOTAL=$(jq '.stats.tests' cypress-output.json)
          PASSED=$(jq '.stats.passes' cypress-output.json)
          FAILED=$(jq '.stats.failures' cypress-output.json)
          SKIPPED=$(jq '.stats.pending' cypress-output.json)

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

      - name: Send Webhook Notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TOTAL="${{ steps.merge.outputs.total }}"
          PASSED="${{ steps.merge.outputs.passed }}"
          FAILED="${{ steps.merge.outputs.failed }}"
          SKIPPED="${{ steps.merge.outputs.skipped }}"

          if [ "$STATUS" = "success" ]; then
            COLOR="00FF00"
            MESSAGE="✅ Build passed"
          else
            COLOR="FF0000"
            MESSAGE="❌ Build failed"
          fi

          cat <<EOF > payload.json
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "summary": "Cypress Pipeline",
            "themeColor": "$COLOR",
            "title": "GitHub Actions - Cypress Pipeline",
            "text": "$MESSAGE<br>
                     Repository: ${{ github.repository }}<br>
                     Total: $TOTAL<br>
                     Passed: $PASSED<br>
                     Failed: $FAILED<br>
                     Skipped: $SKIPPED<br>
                     Run: <a href='$RUN_URL'>View Logs</a>"
          }
          EOF

          curl -H "Content-Type: application/json" \
               -d @payload.json \
               "$WEBHOOK_URL"
