name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request: 

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm ci
          npx cypress install
          npm install --save-dev mochawesome mochawesome-merge mochawesome-report-generator

      - name: Run Cypress tests with Mochawesome
        run: |
          npx cypress run \
            --reporter mochawesome \
            --reporter-options reportDir=cypress/results,overwrite=false,html=false,json=true

      - name: Merge Mochawesome reports
        run: |
          npx mochawesome-merge cypress/results/*.json > cypress/results/mochawesome.json
          cat cypress/results/mochawesome.json

      - name: Send results to Teams
        if: always()
        run: |
          RESULTS=$(cat cypress/results/mochawesome.json)
          TOTAL=$(echo $RESULTS | jq '.stats.tests')
          PASSED=$(echo $RESULTS | jq '.stats.passes')
          FAILED=$(echo $RESULTS | jq '.stats.failures')
          SKIPPED=$(echo $RESULTS | jq '.stats.skipped')

          STATUS="success"
          if [ "$FAILED" -gt 0 ]; then
            STATUS="failure"
          fi

          THEME_COLOR="00FF00"
          if [ "$STATUS" = "failure" ]; then
            THEME_COLOR="FF0000"
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -H 'Content-Type: application/json' \
            -d "{
              \"@type\": \"MessageCard\",
              \"@context\": \"https://schema.org/extensions\",
              \"summary\": \"Cypress Pipeline Results\",
              \"themeColor\": \"${THEME_COLOR}\",
              \"title\": \"Cypress Tests - ${STATUS}\",
              \"text\": \"📊 Total: ${TOTAL}<br>✅ Passed: ${PASSED}<br>❌ Failed: ${FAILED}<br>⚠️ Skipped: ${SKIPPED}<br><br>🔗 <a href='${RUN_URL}'>View Logs</a>\"
            }" \
            ${{ secrets.TEAMS_WEBHOOK_URL }}
