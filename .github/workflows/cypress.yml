name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npx cypress run || true # prevents job failure so email always runs

      - name: Send result via SendGrid (HTML email)
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.sendgrid.net
          server_port: 587
          secure: false
          username: "apikey"
          password: ${{ secrets.SENDGRID_API_KEY }}
          subject: "Cypress Pipeline - ${{ job.status }}"
          from: "GitHub Actions <kishorekumar.gunasekar@bounteous.com>"
          to: "kishorekumargunasekar@gmail.com" # replace with Teams channel email
          html_body: |
            <h2 style="color:#0366d6;">🚀 Cypress Pipeline - ${{ job.status }}</h2>
            <p><b>Repository:</b> ${{ github.repository }}</p>
            <p><b>Workflow:</b> ${{ github.workflow }}</p>
            <p><b>Run Number:</b> ${{ github.run_number }}</p>
            <p><b>Status:</b>
              <span style="color:${{ job.status == 'success' && 'green' || 'red' }};">
                ${{ job.status }}
              </span>
            </p>
            <p>
              🔗 <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">
              View Logs</a>
            </p>
