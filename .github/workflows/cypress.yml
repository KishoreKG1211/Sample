name: Cypress Tests


on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npx cypress run || true   # prevents job failure so email always runs

      - name: Send result to Teams channel
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Cypress Pipeline - ${{ job.status }}"
          to: "Demo Channel - Business as Usual <e578a964.bounteous.com@amer.teams.ms>"
          from: "GitHub Actions <${{ secrets.EMAIL_USERNAME }}>"
          body: |
            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_number }}
            Status: ${{ job.status }}
            Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
