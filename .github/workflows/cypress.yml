name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm ci
          npx cypress install

      - name: Run Cypress tests and capture results
        id: cypress
        run: |
          set -o pipefail
          # Run Cypress with JSON reporter
          npx cypress run --reporter json > cypress-output.json

          echo "Cypress Stats:"
          cat cypress-output.json | jq '.stats'

          # Extract stats
          TOTAL=$(jq '.stats.tests' cypress-output.json)
          PASSED=$(jq '.stats.passes' cypress-output.json)
          FAILED=$(jq '.stats.failures' cypress-output.json)
          SKIPPED=$(jq '.stats.pending' cypress-output.json)

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

      - name: Send Webhook Notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TOTAL=${{ steps.cypress.outputs.total }}
          PASSED=${{ steps.cypress.outputs.passed }}
          FAILED=${{ steps.cypress.outputs.failed }}
          SKIPPED=${{ steps.cypress.outputs.skipped }}

          if [ "$STATUS" = "success" ]; then
            COLOR="00FF00"
            MESSAGE="✅ Build passed"
          else
            COLOR="FF0000"
            MESSAGE="❌ Build failed"
          fi

          cat <<EOF > payload.json
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "summary": "Cypress Pipeline",
            "themeColor": "$COLOR",
            "title": "GitHub Actions - Cypress Pipeline",
            "text": "$MESSAGE<br>
                     Repository: ${{ github.repository }}<br>
                     Total: $TOTAL<br>
                     Passed: $PASSED<br>
                     Failed: $FAILED<br>
                     Skipped: $SKIPPED<br>
                     Run: <a href='$RUN_URL'>View Logs</a>"
          }
          EOF

          curl -H "Content-Type: application/json" \
               -d @payload.json \
               "$WEBHOOK_URL"
