name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm ci
          npx cypress install

      - name: Run Cypress tests
        run: npx cypress run
        continue-on-error: true   # run webhook step even if tests fail

      - name: Send Webhook Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" = "success" ]; then
            COLOR="00FF00"
            MESSAGE="✅ Build passed"
          else
            COLOR="FF0000"
            MESSAGE="❌ Build failed"
          fi

          cat <<EOF > payload.json
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "summary": "Cypress Pipeline",
            "themeColor": "$COLOR",
            "title": "GitHub Actions - Cypress Pipeline",
            "text": "$MESSAGE<br>
                     Repository: ${{ github.repository }}<br>
                     Run: <a href='$RUN_URL'>View Logs</a>"
          }
          EOF

          curl -H "Content-Type: application/json" \
               -d @payload.json \
               "$WEBHOOK_URL"
